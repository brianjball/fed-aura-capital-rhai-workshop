<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Fed Aura Capital architecture with the MLflow Prompt Registry highlighted</title>
  <desc id="desc">The complete Lenora AI platform is dimmed except for the MLflow Prompt Registry, where tested system prompts are saved and versioned.</desc>
  <defs>
    <mask id="spotlight-mask">
      <rect width="1400" height="850" fill="white"/>
      <rect x="460" y="730" width="208" height="62" rx="22" fill="black"/>
    </mask>
    <filter id="focus-shadow" x="-25%" y="-50%" width="150%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00b9b9" flood-opacity="0.7"/>
    </filter>
  </defs>
  <svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">

  <title id="title">Fed Aura Capital AI platform architecture</title>
  <desc id="desc">Users interact with Lenora. Lenora routes requests through persona-specific LangGraph agents to self-hosted models, MCP tools, and a RAG knowledge base. MLflow observes the system, while Keycloak, NeMo Guardrails, the MaaS gateway, and OpenShell provide security.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536270"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#151515" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: RedHatText, "Red Hat Text", Arial, sans-serif; fill: #151515; }
      .title { font-size: 28px; font-weight: 700; }
      .layer-title { font-size: 18px; font-weight: 700; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #536270; }
      .flow { fill: none; stroke: #536270; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #536270; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .card { fill: #fff; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .focus-frame { fill: none; stroke-width: 3; rx: 18; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#f7f7f7"/>
  <text x="700" y="45" class="title" text-anchor="middle">Fed Aura Capital — Lenora AI Platform</text>

  <!-- Security layer: this group can be highlighted as a single workshop focus. -->
  <g id="security-layer">
    <rect x="28" y="68" width="1344" height="754" class="focus-frame" stroke="#c9190b" stroke-dasharray="12 7"/>
    <rect x="52" y="87" width="184" height="31" rx="15" fill="#c9190b"/>
    <text x="144" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SECURITY BOUNDARY</text>

    <g id="identity-security">
      <rect x="70" y="139" width="198" height="76" class="card" stroke="#c9190b"/>
      <text x="169" y="169" class="card-title" text-anchor="middle">Keycloak OIDC</text>
      <text x="169" y="193" class="body" text-anchor="middle">Identity + role claims</text>
    </g>
    <g id="guardrails-security">
      <rect x="310" y="139" width="224" height="76" class="card" stroke="#c9190b"/>
      <text x="422" y="169" class="card-title" text-anchor="middle">NeMo Guardrails</text>
      <text x="422" y="193" class="body" text-anchor="middle">Input + output shields</text>
    </g>
    <g id="gateway-security">
      <rect x="576" y="139" width="224" height="76" class="card" stroke="#c9190b"/>
      <text x="688" y="169" class="card-title" text-anchor="middle">MaaS Gateway</text>
      <text x="688" y="193" class="body" text-anchor="middle">Access + usage controls</text>
    </g>
    <g id="sandbox-security">
      <rect x="842" y="139" width="224" height="76" class="card" stroke="#c9190b"/>
      <text x="954" y="169" class="card-title" text-anchor="middle">OpenShell</text>
      <text x="954" y="193" class="body" text-anchor="middle">Deny-by-default sandbox</text>
    </g>
    <g id="tool-authorization-security">
      <rect x="1108" y="139" width="224" height="76" class="card" stroke="#c9190b"/>
      <text x="1220" y="169" class="card-title" text-anchor="middle">Tool RBAC</text>
      <text x="1220" y="193" class="body" text-anchor="middle">Role-scoped execution</text>
    </g>
  </g>

  <g id="experience-layer">
    <rect x="70" y="270" width="210" height="144" class="card" stroke="#0066cc"/>
    <text x="175" y="305" class="layer-title" text-anchor="middle">People</text>
    <text x="175" y="335" class="body" text-anchor="middle">Prospect · Borrower</text>
    <text x="175" y="359" class="body" text-anchor="middle">Loan Officer · Underwriter</text>
    <text x="175" y="383" class="body" text-anchor="middle">CEO</text>

    <rect x="330" y="270" width="220" height="144" class="card" stroke="#0066cc" fill="#e7f1fa"/>
    <text x="440" y="319" font-size="28" font-weight="700" text-anchor="middle" fill="#0066cc">Lenora</text>
    <text x="440" y="349" class="body" text-anchor="middle">Conversational experience</text>
    <text x="440" y="373" class="small" text-anchor="middle">React UI + FastAPI</text>
    <path d="M 280 342 L 330 342" class="flow"/>
  </g>

  <!-- Agent focus frame. -->
  <g id="agents-layer">
    <rect x="600" y="250" width="710" height="184" class="focus-frame" stroke="#6753ac"/>
    <text x="620" y="280" class="layer-title" fill="#6753ac">PERSONA AGENTS · LANGGRAPH</text>
    <g fill="#f2f0f8" stroke="#6753ac" stroke-width="2">
      <rect x="625" y="304" width="118" height="88" rx="10"/>
      <rect x="758" y="304" width="118" height="88" rx="10"/>
      <rect x="891" y="304" width="118" height="88" rx="10"/>
      <rect x="1024" y="304" width="118" height="88" rx="10"/>
      <rect x="1157" y="304" width="128" height="88" rx="10"/>
    </g>
    <text x="684" y="348" class="card-title" text-anchor="middle">Public</text>
    <text x="684" y="371" class="small" text-anchor="middle">Assistant</text>
    <text x="817" y="348" class="card-title" text-anchor="middle">Borrower</text>
    <text x="817" y="371" class="small" text-anchor="middle">Assistant</text>
    <text x="950" y="342" class="card-title" text-anchor="middle">Loan</text>
    <text x="950" y="365" class="card-title" text-anchor="middle">Officer</text>
    <text x="1083" y="348" class="card-title" text-anchor="middle">Underwriter</text>
    <text x="1083" y="371" class="small" text-anchor="middle">Assistant</text>
    <text x="1221" y="348" class="card-title" text-anchor="middle">CEO</text>
    <text x="1221" y="371" class="small" text-anchor="middle">Assistant</text>
    <path d="M 550 342 L 600 342" class="flow"/>
  </g>

  <!-- Model focus frame. -->
  <g id="models-layer">
    <rect x="70" y="493" width="366" height="190" class="focus-frame" stroke="#ee0000"/>
    <text x="92" y="524" class="layer-title" fill="#c9190b">MODELS</text>
    <rect x="94" y="546" width="318" height="111" class="card" stroke="#ee0000" fill="#fff1f1"/>
    <text x="253" y="577" class="card-title" text-anchor="middle">Self-hosted inference</text>
    <text x="253" y="603" class="body" text-anchor="middle">Fast + capable language models</text>
    <text x="253" y="627" class="small" text-anchor="middle">vLLM · OpenAI-compatible API</text>
  </g>

  <!-- RAG focus frame. -->
  <g id="rag-layer">
    <rect x="472" y="493" width="366" height="190" class="focus-frame" stroke="#3e8635"/>
    <text x="494" y="524" class="layer-title" fill="#3e8635">RAG · TRUSTED KNOWLEDGE</text>
    <rect x="496" y="546" width="318" height="111" class="card" stroke="#3e8635" fill="#f3faf2"/>
    <text x="655" y="577" class="card-title" text-anchor="middle">PostgreSQL + pgvector</text>
    <text x="655" y="603" class="body" text-anchor="middle">Compliance KB embeddings</text>
    <text x="655" y="627" class="small" text-anchor="middle">Federal · agency · internal policy</text>
  </g>

  <!-- MCP focus frame. -->
  <g id="mcp-tools-layer">
    <rect x="874" y="493" width="436" height="190" class="focus-frame" stroke="#f0ab00"/>
    <text x="896" y="524" class="layer-title" fill="#9c6700">MCP TOOLS</text>
    <rect x="898" y="546" width="184" height="111" class="card" stroke="#f0ab00" fill="#fff8e5"/>
    <text x="990" y="579" class="card-title" text-anchor="middle">Risk server</text>
    <text x="990" y="605" class="body" text-anchor="middle">Predictive model</text>
    <text x="990" y="629" class="small" text-anchor="middle">Risk assessment</text>
    <rect x="1100" y="546" width="186" height="111" class="card" stroke="#f0ab00" fill="#fff8e5"/>
    <text x="1193" y="579" class="card-title" text-anchor="middle">Business tools</text>
    <text x="1193" y="605" class="body" text-anchor="middle">Role-scoped actions</text>
    <text x="1193" y="629" class="small" text-anchor="middle">Data + workflow APIs</text>
  </g>

  <path d="M 770 434 C 720 462, 380 450, 253 493" class="flow"/>
  <path d="M 910 434 C 860 463, 730 457, 655 493" class="flow"/>
  <path d="M 1080 434 C 1100 458, 1094 470, 1094 493" class="flow"/>

  <!-- Observability is intentionally cross-cutting and receives traces from every runtime area. -->
  <g id="observability-layer">
    <rect x="70" y="730" width="1240" height="62" class="focus-frame" stroke="#009596"/>
    <text x="96" y="768" class="layer-title" fill="#007878">MLFLOW</text>
    <rect x="270" y="744" width="180" height="34" rx="17" fill="#e0f5f5" stroke="#009596"/>
    <text x="360" y="767" class="body" text-anchor="middle">Tracing</text>
    <rect x="474" y="744" width="180" height="34" rx="17" fill="#e0f5f5" stroke="#009596"/>
    <text x="564" y="767" class="body" text-anchor="middle">Prompt Registry</text>
    <rect x="678" y="744" width="180" height="34" rx="17" fill="#e0f5f5" stroke="#009596"/>
    <text x="768" y="767" class="body" text-anchor="middle">Evaluations</text>
  </g>

</svg>
  <rect width="1400" height="850" fill="#151515" opacity="0.6" mask="url(#spotlight-mask)"/>

  <g id="prompt-registry-focus" font-family="RedHatText, 'Red Hat Text', Arial, sans-serif">
    <rect x="462" y="732" width="204" height="58" rx="20" fill="none" stroke="#00b9b9" stroke-width="7" filter="url(#focus-shadow)"/>
    <rect x="762" y="704" width="410" height="66" rx="33" fill="#009596"/>
    <text x="967" y="731" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">MODULE 3 FOCUS · PROMPT REGISTRY</text>
    <text x="967" y="753" text-anchor="middle" font-size="14" fill="#ffffff">Save · version · compare system prompts</text>
    <path d="M 762 748 L 670 756" fill="none" stroke="#00b9b9" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
