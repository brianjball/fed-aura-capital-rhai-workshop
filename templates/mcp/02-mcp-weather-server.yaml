---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-weather
  namespace: mcp-servers
  labels:
    app: mcp-weather
    app.kubernetes.io/name: mcp-weather
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-weather
  template:
    metadata:
      labels:
        app: mcp-weather
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: mcp-weather
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          image: quay.io/rh-aiservices-bu/mcp-weather:0.1.0-amd64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: MCP_SERVER_HOST
              value: "0.0.0.0"
            - name: MCP_SERVER_PORT
              value: "3001"
            - name: WEATHER_CACHE_TTL
              value: "300"
            - name: WEATHER_API_KEY
              value: "demo-key"
            - name: WEATHER_PROVIDER
              value: "openweathermap"
            - name: WEATHER_DEMO_MODE
              value: "true"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-weather
  namespace: mcp-servers
  labels:
    app: mcp-weather
    app.kubernetes.io/name: mcp-weather
    app.kubernetes.io/component: mcp
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mcp-weather
