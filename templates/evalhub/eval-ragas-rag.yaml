name: "rag-quality-eval"
model:
  url: "${MODEL_URL}"
  name: "${MODEL_NAME}"
  auth:
    secret_ref: "${MODEL_AUTH_SECRET}"
benchmarks:
  - id: ragas_rag_default
    provider_id: ragas
    parameters:
      temperature: "0.1"
      max_tokens: "4096"
      max_workers: "2"
    test_data_ref:
      s3:
        bucket: "eval-data"
        key: "ragas"
        secret_ref: "${S3_CREDENTIALS_SECRET}"
