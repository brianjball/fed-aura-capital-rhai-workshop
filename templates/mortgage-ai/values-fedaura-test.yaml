  MCP_RISK_SERVER_URL: "http://mcp-risk-server:8081/mcp"

  # MLflow - RHOAI MLflow in-cluster
  # Note: MLFLOW_TRACKING_AUTH "kubernetes" requires mlflow-kubernetes-auth pip package.
  # If not installed in the image, use token auth instead:
  #   oc create token mortgage-ai-mlflow-client -n wksp-user1 --duration=8760h
  MLFLOW_TRACKING_URI: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow"
  MLFLOW_TRACKING_AUTH: "kubernetes-namespaced"
  MLFLOW_TRACKING_TOKEN: ""
  MLFLOW_EXPERIMENT_NAME: "mortgage-ai"
  MLFLOW_WORKSPACE: "wksp-user1"
  MLFLOW_TRACKING_INSECURE_TLS: "false"  # FIXME: true

# Disable components handled by other templates
keycloak:
  enabled: false
minio:
  enabled: true
mcpRiskServer:
  enabled: true
mcpWeatherServer:
  enabled: true

# Enable demo data
seed:
  enabled: true

# MLflow RBAC for RHOAI
mlflow:
  rbac:
    enabled: true
    pipelineRunner:
      enabled: true
