---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: tinyllama
  namespace: wksp-user1
  annotations:
    opendatahub.io/kserve-runtime: vllm
    opendatahub.io/apiProtocol: REST
    opendatahub.io/template-display-name: CUSTOM - vLLM CPU for TinyLlama
    opendatahub.io/template-name: vllm-cpu-tinyllama
    openshift.io/display-name: CUSTOM - vLLM CPU for TinyLlama
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  labels:
    opendatahub.io/dashboard: "true"
spec:
  containers:
    - args:
        - '--port=8080'
        - '--model=/mnt/models'
        - '--served-model-name={{.Name}}'
        - '--max-model-len=2048'
      command:
        - python
        - '-m'
        - vllm.entrypoints.openai.api_server
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_CPU_KVCACHE_SPACE
          value: '4'
      image: registry.redhat.io/rhaiis/vllm-cpu-rhel9@sha256:f05e773647dddd37ec6c2215cb14bec87e4ab5a7d37f2e110d16cd92355427d3
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
