# MLflow tracking server for RHOAI
# Cluster-scoped CR - the operator creates pods/services in redhat-ods-applications
# Service endpoint: https://mlflow.redhat-ods-applications.svc.cluster.local:8443
#
# Workspaces are auto-discovered from namespaces with label opendatahub.io/dashboard: "true"
---
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
spec:
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  serveArtifacts: true
  artifactsDestination: "file:///mlflow/artifacts"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  workspaceLabelSelector:
    matchLabels:
      opendatahub.io/dashboard: "true"
